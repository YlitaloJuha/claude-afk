<svg xmlns="http://www.w3.org/2000/svg" width="912" height="354" viewBox="0 0 912 354" role="img" aria-label="AFK test mode running in a real terminal session">
<title>AFK test mode running in a real terminal session</title>
<rect width="912" height="354" rx="10" fill="#1e1e2e"/>
<circle cx="20" cy="18" r="5" fill="#f38ba8"/><circle cx="38" cy="18" r="5" fill="#f9e2af"/><circle cx="56" cy="18" r="5" fill="#a6e3a1"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="34.9" y="56" fill="#cdd6f4">The user pressed the AFK button in test mode. Start now.</text>
<text x="34.9" y="98" fill="#cdd6f4">This mode: Improve the tests: run the suite, add tests for what is uncovered, and repair</text>
<text x="34.9" y="119" fill="#cdd6f4">failing tests. Change production code only to fix a real bug a test exposed, and report each one.</text>
<text x="34.9" y="161" fill="#7f849c">- Do not commit, push, open pull requests, publish, deploy or message anyone.</text>
<text x="34.9" y="182" fill="#7f849c">- Ask no questions. Note a decision that is the user&#x27;s, then take the reversible option.</text>
<text x="18.0" y="224" fill="#7f849c">⠇ Nuzzling…  1s</text>
<rect x="18.0" y="239" width="8.4" height="3" rx="1.5" fill="#a6adc8"/>
<rect x="26.4" y="240" width="59.0" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="93.9" y="245" fill="#7f849c">16% 5h</text>
<rect x="161.3" y="239" width="16.9" height="3" rx="1.5" fill="#a6adc8"/>
<rect x="178.2" y="240" width="50.6" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="237.2" y="245" fill="#7f849c">26% 7d</text>
<text x="658.7" y="245" fill="#7f849c">2 todos</text>
<text x="734.6" y="245" fill="#cdd6f4">AFK test 0</text>
<text x="835.7" y="245" fill="#7f849c">Wrap up</text>
<rect x="18.0" y="282" width="876.7" height="1" fill="#7f849c" fill-opacity=".55"/>
<text x="18.0" y="308" fill="#7f849c">❯</text>
<rect x="18.0" y="324" width="876.7" height="1" fill="#7f849c" fill-opacity=".55"/>
</g>
</svg>
