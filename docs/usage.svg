<svg xmlns="http://www.w3.org/2000/svg" width="912" height="354" viewBox="0 0 912 354" role="img" aria-label="AFK test mode running in a real terminal session">
<title>AFK test mode running in a real terminal session</title>
<rect width="912" height="354" rx="10" fill="#1e1e2e"/>
<circle cx="20" cy="18" r="5" fill="#f38ba8"/><circle cx="38" cy="18" r="5" fill="#f9e2af"/><circle cx="56" cy="18" r="5" fill="#a6e3a1"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
<text x="18.0" y="56" fill="#cdd6f4" textLength="488.9" lengthAdjust="spacingAndGlyphs">  The user pressed the AFK button in test mode. Start now.</text>
<text x="18.0" y="98" fill="#cdd6f4" textLength="758.7" lengthAdjust="spacingAndGlyphs">  This mode: Improve the tests: run the suite, add tests for what is uncovered, and repair</text>
<text x="18.0" y="119" fill="#cdd6f4" textLength="834.6" lengthAdjust="spacingAndGlyphs">  failing tests. Change production code only to fix a real bug a test exposed, and report each one.</text>
<text x="18.0" y="161" fill="#7f849c" textLength="666.0" lengthAdjust="spacingAndGlyphs">  - Do not commit, push, open pull requests, publish, deploy or message anyone.</text>
<text x="18.0" y="182" fill="#7f849c" textLength="758.7" lengthAdjust="spacingAndGlyphs">  - Ask no questions. Note a decision that is the user&#x27;s, then take the reversible option.</text>
<text x="18.0" y="224" fill="#7f849c" textLength="126.4" lengthAdjust="spacingAndGlyphs">⠇ Nuzzling…  1s</text>
<text x="18.0" y="245" fill="#a6adc8" textLength="8.4" lengthAdjust="spacingAndGlyphs">━</text>
<text x="26.4" y="245" fill="#7f849c" textLength="134.9" lengthAdjust="spacingAndGlyphs">─────── 16% 5h  </text>
<text x="161.3" y="245" fill="#a6adc8" textLength="16.9" lengthAdjust="spacingAndGlyphs">━━</text>
<text x="178.2" y="245" fill="#7f849c" textLength="126.4" lengthAdjust="spacingAndGlyphs">────── 26% 7d  </text>
<text x="658.7" y="245" fill="#7f849c" textLength="75.9" lengthAdjust="spacingAndGlyphs">2 todos  </text>
<text x="734.6" y="245" fill="#cdd6f4" textLength="84.3" lengthAdjust="spacingAndGlyphs">AFK test 0</text>
<text x="818.9" y="245" fill="#7f849c" textLength="75.9" lengthAdjust="spacingAndGlyphs">  Wrap up</text>
<text x="18.0" y="287" fill="#7f849c" textLength="876.7" lengthAdjust="spacingAndGlyphs">────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="18.0" y="308" fill="#7f849c" textLength="8.4" lengthAdjust="spacingAndGlyphs">❯</text>
<text x="18.0" y="329" fill="#7f849c" textLength="876.7" lengthAdjust="spacingAndGlyphs">────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
</g>
</svg>
